name: Build Simplified Android App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Download and Unzip Your Model
      run: |
        pip install gdown
        # 用你的链接下载 QiDeBERTa 模型和词表
        gdown "1YjFdJcVkHOwfLV6j7iwQCctdTpLz_NPt" -O model.zip
        # -j 参数表示解压时忽略文件夹层级，直接把文件放在当前目录
        unzip -j -o model.zip

    - name: Scaffold Android Project (Simplified)
      run: |
        mkdir -p app/src/main/java/com/example/csc
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/assets
        mkdir -p gradle/wrapper

        # 拷贝你的模型文件到手机资源库
        cp qideberta_csc_traced.pt app/src/main/assets/ || true
        cp spm.model app/src/main/assets/ || true

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath "com.android.tools.build:gradle:7.4.2" }
        }
        allprojects { repositories { google(); mavenCentral(); maven { url "https://jitpack.io" } } }
        EOF

        echo "include ':app'" > settings.gradle

        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            namespace 'com.example.csc'
            compileSdk 33
            defaultConfig {
                applicationId "com.example.csc"
                minSdk 26
                targetSdk 33
                versionCode 1
                versionName "1.0"
                ndk { abiFilters "arm64-v8a" }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_11
                targetCompatibility JavaVersion.VERSION_11
            }
            aaptOptions {
                noCompress "pt", "model"
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.8.0'
            implementation 'org.pytorch:pytorch_android_lite:1.13.0'
            implementation 'com.github.wpm:sentencepiece-android:0.1.92'
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:label="极简纠错"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:orientation="vertical" android:padding="16dp" android:background="#F5F5F5">
            <TextView android:layout_width="match_parent" android:layout_height="wrap_content"
                android:text="中文文本纠错" android:textSize="22sp" android:textStyle="bold"
                android:textColor="#333333" android:layout_marginBottom="16dp"/>
            <EditText android:id="@+id/etInput" android:layout_width="match_parent"
                android:layout_height="120dp" android:hint="请输入需要纠错的文本..."
                android:gravity="top|start" android:background="#FFFFFF"
                android:padding="12dp" android:textSize="16sp" android:textColor="#000000"/>
            <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginTop="16dp">
                <TextView android:id="@+id/tvTemp" android:layout_width="120dp" android:layout_height="wrap_content" android:text="温度: 1.0"/>
                <SeekBar android:id="@+id/seekTemp" android:layout_width="match_parent" android:layout_height="wrap_content" android:max="200" android:progress="100"/>
            </LinearLayout>
            <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginTop="8dp">
                <TextView android:id="@+id/tvThreshold" android:layout_width="120dp" android:layout_height="wrap_content" android:text="置信度: 0.8"/>
                <SeekBar android:id="@+id/seekThreshold" android:layout_width="match_parent" android:layout_height="wrap_content" android:max="100" android:progress="80"/>
            </LinearLayout>
            <Button android:id="@+id/btnCorrect" android:layout_width="match_parent"
                android:layout_height="50dp" android:layout_marginTop="16dp" android:text="开始纠错" android:backgroundTint="#2196F3"/>
            <ScrollView android:layout_width="match_parent" android:layout_height="match_parent" android:layout_marginTop="16dp" android:background="#FFFFFF">
                <TextView android:id="@+id/tvResult" android:layout_width="match_parent"
                    android:layout_height="wrap_content" android:text="请等待模型加载..."
                    android:textSize="18sp" android:padding="12dp" android:textColor="#000000" android:lineSpacingExtra="8dp"/>
            </ScrollView>
        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/java/com/example/csc/MainActivity.java
        package com.example.csc;
        import android.app.Activity;
        import android.content.Context;
        import android.graphics.Color;
        import android.os.Bundle;
        import android.text.Spannable;
        import android.text.SpannableStringBuilder;
        import android.text.style.ForegroundColorSpan;
        import android.text.style.StrikethroughSpan;
        import android.widget.*;
        import org.pytorch.*;
        import sentencepiece.SentencePieceProcessor;
        import java.io.*;
        import java.util.Locale;

        public class MainActivity extends Activity {
            private Module module = null;
            private SentencePieceProcessor spProcessor = null;
            private EditText etInput;
            private Button btnCorrect;
            private TextView tvResult, tvTemp, tvThreshold;
            private SeekBar seekTemp, seekThreshold;
            private float temperature = 1.0f;
            private float threshold = 0.8f;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                etInput = findViewById(R.id.etInput);
                btnCorrect = findViewById(R.id.btnCorrect);
                tvResult = findViewById(R.id.tvResult);
                tvTemp = findViewById(R.id.tvTemp);
                tvThreshold = findViewById(R.id.tvThreshold);
                seekTemp = findViewById(R.id.seekTemp);
                seekThreshold = findViewById(R.id.seekThreshold);

                setupSeekBars();

                new Thread(() -> {
                    try {
                        String modelPath = assetFilePath(this, "qideberta_csc_traced.pt");
                        module = LiteModuleLoader.load(modelPath);
                        String spmPath = assetFilePath(this, "spm.model");
                        spProcessor = new SentencePieceProcessor();
                        spProcessor.load(spmPath);
                        runOnUiThread(() -> {
                            tvResult.setText("模型加载完毕，请输入文字！");
                            Toast.makeText(MainActivity.this, "加载成功", Toast.LENGTH_SHORT).show();
                        });
                    } catch (Exception e) {
                        runOnUiThread(() -> tvResult.setText("加载失败: " + e.getMessage()));
                    }
                }).start();

                btnCorrect.setOnClickListener(v -> {
                    String text = etInput.getText().toString();
                    if (text.isEmpty() || module == null || spProcessor == null) return;
                    runInference(text);
                });
            }

            private void setupSeekBars() {
                seekTemp.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                    @Override public void onProgressChanged(SeekBar seekBar, int progress, boolean fromUser) {
                        temperature = progress / 100f;
                        if (temperature < 0.1f) temperature = 0.1f;
                        tvTemp.setText(String.format(Locale.getDefault(), "温度: %.1f", temperature));
                    }
                    @Override public void onStartTrackingTouch(SeekBar seekBar) {}
                    @Override public void onStopTrackingTouch(SeekBar seekBar) {}
                });
                seekThreshold.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                    @Override public void onProgressChanged(SeekBar seekBar, int progress, boolean fromUser) {
                        threshold = progress / 100f;
                        tvThreshold.setText(String.format(Locale.getDefault(), "置信度: %.2f", threshold));
                    }
                    @Override public void onStartTrackingTouch(SeekBar seekBar) {}
                    @Override public void onStopTrackingTouch(SeekBar seekBar) {}
                });
            }

            private void runInference(String text) {
                try {
                    int[] spIds = spProcessor.encodeAsIds(text);
                    int seqLen = spIds.length + 2;
                    long[] inputData = new long[seqLen];
                    inputData[0] = 1; // CLS
                    for (int i = 0; i < spIds.length; i++) inputData[i + 1] = spIds[i];
                    inputData[seqLen - 1] = 2; // SEP

                    long[] shape = new long[]{1, seqLen};
                    Tensor inputTensor = Tensor.fromBlob(inputData, shape);
                    Tensor outputTensor = module.forward(IValue.from(inputTensor)).toTensor();
                    float[] logits = outputTensor.getDataAsFloatArray();
                    int vocabSize = logits.length / seqLen;

                    SpannableStringBuilder ssb = new SpannableStringBuilder();
                    for (int i = 1; i < seqLen - 1; i++) {
                        int origTokenId = (int) inputData[i];
                        int startIdx = i * vocabSize;

                        float maxLogit = logits[startIdx];
                        for (int j = 1; j < vocabSize; j++) {
                            if (logits[startIdx + j] > maxLogit) maxLogit = logits[startIdx + j];
                        }

                        float sumExp = 0f;
                        float[] exps = new float[vocabSize];
                        for (int j = 0; j < vocabSize; j++) {
                            exps[j] = (float) Math.exp((logits[startIdx + j] - maxLogit) / temperature);
                            sumExp += exps[j];
                        }

                        float maxProb = 0f;
                        int predTokenId = 0;
                        for (int j = 0; j < vocabSize; j++) {
                            float prob = exps[j] / sumExp;
                            if (prob > maxProb) { maxProb = prob; predTokenId = j; }
                        }

                        String origChar = spProcessor.decodeIds(new int[]{origTokenId}).replace(" ", "");
                        
                        if (predTokenId != origTokenId && maxProb >= threshold) {
                            String predChar = spProcessor.decodeIds(new int[]{predTokenId}).replace(" ", "");
                            
                            int startGray = ssb.length();
                            ssb.append(origChar);
                            ssb.setSpan(new StrikethroughSpan(), startGray, ssb.length(), Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);
                            ssb.setSpan(new ForegroundColorSpan(Color.GRAY), startGray, ssb.length(), Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);

                            int startRed = ssb.length();
                            String confStr = String.format(Locale.getDefault(), "%.2f", maxProb);
                            ssb.append(predChar).append("(").append(confStr).append(")");
                            ssb.setSpan(new ForegroundColorSpan(Color.RED), startRed, ssb.length(), Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);
                        } else {
                            ssb.append(origChar);
                        }
                    }
                    tvResult.setText(ssb);
                } catch (Exception e) {
                    tvResult.setText("推理发生错误: " + e.getMessage());
                }
            }

            private String assetFilePath(Context context, String assetName) throws IOException {
                File file = new File(context.getFilesDir(), assetName);
                if (file.exists() && file.length() > 0) return file.getAbsolutePath();
                try (InputStream is = context.getAssets().open(assetName);
                     FileOutputStream os = new FileOutputStream(file)) {
                    byte[] buffer = new byte[4 * 1024];
                    int read;
                    while ((read = is.read(buffer)) != -1) os.write(buffer, 0, read);
                    os.flush();
                }
                return file.getAbsolutePath();
            }
        }
        EOF

        # 同样使用你提供代码里最稳定的原生 gradle 7.5 配置方案
        wget -q https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
        wget -q https://raw.githubusercontent.com/gradle/gradle/master/gradlew -O gradlew
        chmod +x gradlew

        cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-7.5-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF

    - name: Build APK (Release mode)
      run: |
        ./gradlew assembleDebug --no-daemon

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: CSCChecker-App
        path: app/build/outputs/apk/debug/app-debug.apk
